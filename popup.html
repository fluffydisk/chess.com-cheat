<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chess Helper - Ayarlar</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" data-tab="moves">Hamleler</button>
      <button class="tab-btn" data-tab="best">Best Move</button>
    </div>

    <div class="tab-panel" id="moves" style="display:block;">
      <div class="moves-header">
        <div id="gameMeta" class="game-meta">Oyun bilgisi yükleniyor...</div>
        <button id="refreshMoves">Yenile</button>
      </div>
      <div id="movesContainer" class="moves-container" tabindex="0">
        <ul id="movesList" class="moves-list"></ul>
      </div>
      <div class="moves-hint">Fareyle sürükleyerek kaydırabilirsiniz (veya scroll kullanın).</div>
    </div>
    <div class="tab-panel" id="best" style="display:none;">
      <h3>Best Move</h3>
      <div class="best-controls">
        <label for="depth">Depth</label>
        <select id="depth">
          <option value="8">8</option>
          <option value="10">10</option>
          <option value="12">12</option>
          <option value="15" selected>15</option>
        </select>
        <button id="computeBest">Hesapla</button>
      </div>
      <div id="bestResult" class="best-result">Henüz hesaplanmadı.</div>
      <div id="bestInfo" class="best-info"></div>
    </div>
  </div>
  <script>
    console.log('Inline script: HTML yüklendi');
  </script>
  <script src="chess.js"></script>
  <script>
    console.log('chess.js yüklendi, Chess tanımı:', typeof Chess);
  </script>
  <script src="popup.js"></script>
  <script>
    console.log('popup.js yüklendi');
  </script>
</body>
</html>
